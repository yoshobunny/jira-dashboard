name: Actualizar datos de Jira

on:
  schedule:
    - cron: '0 */4 * * *'   # Corre cada 4 horas automáticamente
  workflow_dispatch:          # También permite correrlo manualmente desde GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr fetch_jira.py
        env:
          JIRAM: ${{ secrets.JIRAM }}
          JAT:   ${{ secrets.JAT }}
        run: python fetch_jira.py

      - name: Commit y push de data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: actualizar data.json $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
